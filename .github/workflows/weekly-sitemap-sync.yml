name: Sincronización semanal del sitemap a Google Sheets

on:
  schedule:
    # Lunes a las 06:00 UTC. Ajusta la hora a tu gusto.
    - cron: "0 6 * * 1"
  workflow_dispatch: {} # permite lanzarlo manualmente desde la pestaña Actions

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar navegador Chromium para Playwright
        run: playwright install --with-deps chromium

      - name: Ejecutar scraper y actualizar Google Sheets
        env:
          SITEMAP_INDEX_URL: "https://www.muchoneumatico.com/blog/sitemap_index.xml"
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          SHEET_TAB_NAME: "Sitemap URLs"
          CONCURRENCY: "5"
        run: python scripts/scrape_and_update_sheet.py
